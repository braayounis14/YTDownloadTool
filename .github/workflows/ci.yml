name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build (Release)
        run: dotnet build YTDownloadTool.slnx -c Release --nologo

      - name: Run Automated Test Suite
        run: dotnet test YTDownloadTool.slnx -c Release --no-build --nologo --verbosity normal
