name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}".TrimStart('v')
          } else {
            $v = "${{ github.ref_name }}".TrimStart('v')
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download previous release for Velopack delta generation (best effort)
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet tool restore
          New-Item -ItemType Directory -Force -Path artifacts\prev-releases | Out-Null
          dotnet vpk download github --repoUrl "https://github.com/${{ github.repository }}" --outputDir artifacts\prev-releases

      - name: Build, Test, Stage Tools & Package Velopack Release
        shell: pwsh
        run: |
          .\scripts\build-release.ps1 -Version "${{ steps.ver.outputs.version }}" -PreviousReleasesDir "artifacts\prev-releases"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: YTDownloadTool v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/Releases/*
